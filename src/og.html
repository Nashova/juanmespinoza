<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter Variable';
    font-weight: 100 900;
    src: url('../assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter Variable', Inter, system-ui, sans-serif;
    background: #FDFBF8;
    color: #1f2937;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
    border-left: 24px solid #8A5A2B;
    position: relative;
  }
  .mark { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 56px; }
  .mark span { color: #8A5A2B; }
  h1 { font-size: 84px; line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; }
  .title { margin-top: 28px; font-size: 32px; font-weight: 600; color: #8A5A2B; white-space: nowrap; }
  .meta { margin-top: 18px; font-size: 26px; color: #4b5563; white-space: nowrap; }
  .domain { position: absolute; right: 72px; top: 64px; font-size: 28px; font-weight: 600; color: #6b7280; }
  .bar { position: absolute; left: 96px; bottom: 56px; width: 120px; height: 8px; border-radius: 4px; background: #D4A373; }
</style>
</head>
<body>
  <div class="mark"><span>J</span>M<span>E</span>N</div>
  <h1>Juan Manuel<br>Espinoza Nevárez</h1>
  <p class="title">Ingeniero de Software · Arquitecto Empresarial · Líder Técnico</p>
  <p class="meta">Java · JavaScript · Oracle · TOGAF — casi dos décadas de experiencia</p>
  <div class="bar"></div>
  <div class="domain">juanespinoza.lat</div>
</body>
</html>
